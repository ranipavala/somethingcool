<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Purello 2025</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: url('signupbg.svg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .login-card {
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .login-image {
      height: 100%;
      object-fit: cover;
    }

    .brand-logo {
      width: 100px;
      height: auto;
      margin-bottom: 1rem;
    }

    .brand-header img.small-logo {
      width: 40px;
      margin-bottom: 10px;
    }

    .form-floating > label {
      padding: 1rem 1.75rem;
    }

    .form-control {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: rgba(255, 255, 255, 0.8);
      color: #000;
      font-size: 16px;
    }

    .form-control::placeholder {
      color: #444;
      opacity: 1;
    }

    .form-control:focus {
      outline: none;
      box-shadow: 0 0 10px #ff80ff;
      background-color: rgba(255, 255, 255, 1);

    .brand-header h4 {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 2px 2px 10px #000000aa;
    }

  }

  .btn-primary {
  background-color: #9b59b6; /* Purple */
  color: white;
  padding: 0.5rem 1rem;
  border: none;
  border-radius: 0.375rem;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.btn-primary:hover {
  background-color: #f4d03f;  
  color:#000;
  transform: scale(1.08);
  box-shadow: 0 0 12px #ffffff;
}

  </style>
</head>
<body>
  <div class="login-container">
    <div class="container py-5">
      <div class="row d-flex justify-content-center">
        <div class="col-xl-10">
          <div class="card login-card">
            <div class="row g-0">
              <!-- Image Column -->
              <div class="col-md-6 d-none d-md-flex">
                <img src="biglogo.svg" alt="Purello Logo" class="img-fluid login-image w-100">
              </div>

              <!-- Form Column -->
              <div class="col-md-6">
                <div class="card-body p-4 p-md-5">
                  <!-- Brand Header -->
                  <div class="brand-header text-center mb-4">
                    <h2 class="mb-0">Purello 2025</h2>
                    <small class="text-light">Rasa Gila, Sound Gempak</small>
                  </div>

                  <!-- Login Form -->
                  <h5 class="text-center mb-4 text-white">Welcome back</h5>
                  <form name="loginForm" action="login.php" method="post">
                    <div class="form-floating mb-3">
                      <input name="mail" type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
                      <label for="floatingInput">Email address</label>
                    </div>

                    <div class="form-floating mb-3">
                      <input name="password" type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                      <label for="floatingPassword">Password</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-white" for="rememberMe">Remember me</label>
                      </div>
                      <a href="#" class="text-white small text-decoration-none">Forgot password?</a>
                    </div>

                    <button class="btn-primary w-100 py-2 mb-3" type="submit">Login</button>

                    <div class="text-center small text-white">
                      New user? <a href="/WP-Project/User/Signup/signup.html" class="text-decoration-none">Create account</a>
                    </div>
                  </form>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white py-3 mt-auto">
    <div class="container text-center small">
      <p class="mb-1">&copy; 2025 Purello. All rights reserved.</p>
      <p class="mb-0">Contact: <a href="mailto:info@vibrantmusiccompany.com" class="text-white">info@vibedivascompany.com</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js"></script>
</body>
</html>
