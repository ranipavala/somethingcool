<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>airportluggagesys · Supporting Documents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111111;
        --stone: #f6f3ee;
        --sand: #ede7dd;
        --fog: #fdfbf8;
        --muted: #6f6a64;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Manrope", sans-serif;
        background: var(--stone);
        color: var(--ink);
        line-height: 1.6;
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 56px 6vw;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 18px;
      }
      h1 {
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        margin: 0;
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 8px 0 0;
        color: var(--muted);
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--fog);
        border: 1px solid rgba(17, 17, 17, 0.1);
        color: var(--ink);
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        white-space: nowrap;
      }
      .back:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(17, 17, 17, 0.08);
      }
      .card {
        background: var(--fog);
        border: 1px solid rgba(17, 17, 17, 0.08);
        border-radius: 24px;
        padding: 22px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }
      a.file {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
        border-radius: 18px;
        border: 1px solid rgba(17, 17, 17, 0.08);
        text-decoration: none;
        color: inherit;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }
      a.file:hover {
        transform: translateY(-1px);
        border-color: rgba(17, 17, 17, 0.18);
        box-shadow: 0 12px 26px rgba(17, 17, 17, 0.08);
      }
      .name { font-weight: 600; }
      .tag {
        font-size: 0.85rem;
        color: var(--muted);
        border: 1px solid rgba(17, 17, 17, 0.10);
        background: rgba(253, 251, 248, 0.9);
        padding: 6px 10px;
        border-radius: 999px;
        flex: 0 0 auto;
      }
      footer {
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>

  <body>
    <main class="wrap">
      <div class="top">
        <div>
          <h1>airportluggagesys</h1>
          <p class="sub">Supporting documents in this folder.</p>
        </div>
        <a class="back" href="../../index.html">← Back to portfolio</a>
      </div>

      <section class="card" aria-label="Files">
        <ul>
          <li>
            <a class="file" href="./DSA.pdf" target="_blank" rel="noopener">
              <span class="name">DSA.pdf</span>
              <span class="tag">PDF</span>
            </a>
          </li>
          <li>
            <a class="file" href="./DSACode.cpp" target="_blank" rel="noopener">
              <span class="name">DSACode.cpp</span>
              <span class="tag">CPP</span>
            </a>
          </li>
        </ul>
      </section>

      <footer>Tip: Click a file to open it in a new tab.</footer>
    </main>
  </body>
</html>
