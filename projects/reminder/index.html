<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reminder · Supporting Documents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { --ink:#111; --stone:#f6f3ee; --fog:#fdfbf8; --muted:#6f6a64; }
      *{ box-sizing:border-box; }
      body{ margin:0; font-family:"Manrope",sans-serif; background:var(--stone); color:var(--ink); line-height:1.6; }
      .wrap{ max-width:920px; margin:0 auto; padding:56px 6vw; }
      .top{ display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
      h1{ margin:0; font-size:clamp(1.8rem,4vw,2.4rem); letter-spacing:-0.02em; }
      .sub{ margin:8px 0 0; color:var(--muted); }
      .back{ display:inline-flex; gap:10px; align-items:center; padding:10px 14px; border-radius:999px; background:var(--fog); border:1px solid rgba(17,17,17,.1); color:inherit; text-decoration:none; transition:.2s; white-space:nowrap; }
      .back:hover{ transform:translateY(-1px); box-shadow:0 10px 24px rgba(17,17,17,.08); }
      .card{ background:var(--fog); border:1px solid rgba(17,17,17,.08); border-radius:24px; padding:22px; }
      ul{ list-style:none; padding:0; margin:0; display:grid; gap:12px; }
      a.file{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; border-radius:18px; border:1px solid rgba(17,17,17,.08); text-decoration:none; color:inherit; transition:.2s; }
      a.file:hover{ transform:translateY(-1px); border-color:rgba(17,17,17,.18); box-shadow:0 12px 26px rgba(17,17,17,.08); }
      .name{ font-weight:600; }
      .tag{ font-size:.85rem; color:var(--muted); border:1px solid rgba(17,17,17,.10); padding:6px 10px; border-radius:999px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="top">
        <div>
          <h1>reminder</h1>
          <p class="sub">Supporting documents in this folder.</p>
        </div>
        <a class="back" href="../../index.html">← Back to portfolio</a>
      </div>

      <section class="card">
        <ul>
          <li>
            <a class="file" href="./REMinderDemo.mp4" target="_blank" rel="noopener">
              <span class="name">REMinderDemo.mp4</span>
              <span class="tag">MP4</span>
            </a>
          </li>
          <li>
            <a class="file" href="./REMinderReport.pdf" target="_blank" rel="noopener">
              <span class="name">REMinderReport.pdf</span>
              <span class="tag">PDF</span>
            </a>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
