<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>involvements — rani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070707;
      --surface: #0d0d0d;
      --text: #f5f5f5;
      --muted: #888;
      --border: #1a1a1a;
      --pink: #ff4d8d;
      --pink-text: #ff9cc0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Manrope", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 8vw;
      background: #070707ee;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 0.5px solid var(--border);
    }
    .back-btn {
      font-family: monospace;
      font-size: 11px;
      color: #555;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--text); }

    .page { width: min(1160px, 92vw); margin: 0 auto; padding: 48px 0 80px; }
    .page-label {
      font-family: monospace;
      font-size: 10px;
      color: var(--pink);
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      display: block;
    }
    h1 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .gallery-card {
      border-radius: 4px;
      overflow: hidden;
      border: 0.5px solid var(--border);
      background: var(--surface);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .gallery-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.5), 0 0 14px rgba(255,77,141,0.08);
    }
    .thumb {
      all: unset;
      display: block;
      width: 100%;
      cursor: zoom-in;
    }
    .thumb img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(3, 3, 3, 0.88);
      backdrop-filter: blur(10px);
      z-index: 1000;
    }
    .lightbox.is-open { display: flex; }
    .lightbox-content {
      position: relative;
      width: min(1080px, 92vw);
      max-height: 88vh;
      border-radius: 4px;
      overflow: hidden;
      border: 0.5px solid rgba(255,255,255,0.1);
      background: #000;
    }
    .lightbox-image {
      width: 100%;
      max-height: 88vh;
      object-fit: contain;
      display: block;
    }
    .icon-btn {
      position: absolute;
      z-index: 2;
      width: 40px;
      height: 40px;
      border: 0.5px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.5);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      cursor: pointer;
      font-family: monospace;
      transition: border-color 0.2s, background 0.2s;
    }
    .icon-btn:hover { border-color: var(--pink); background: rgba(255,77,141,0.1); }
    .close-btn { top: 12px; right: 12px; }
    .prev-btn, .next-btn { top: 50%; transform: translateY(-50%); }
    .prev-btn { left: 12px; }
    .next-btn { right: 12px; }

    @media (max-width: 1024px) { .gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 780px)  { .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 480px)  { .gallery-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="back-btn" href="../index.html">← [ rani ]</a>
  </nav>

  <main class="page">
    <span class="page-label">[ side quests / gallery ]</span>
    <h1>involvement pictures</h1>
    <p class="subtitle">a full gallery of moments from events, programs, and team collaborations.</p>

    <p style="color:#555;font-family:monospace;font-size:12px;">[ gallery coming soon ]</p>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-content" id="lightbox-content">
      <button class="icon-btn close-btn" id="close-btn" type="button" aria-label="Close">✕</button>
      <button class="icon-btn prev-btn" id="prev-btn" type="button" aria-label="Previous">‹</button>
      <img class="lightbox-image" id="lightbox-image" src="" alt="Expanded involvement picture" />
      <button class="icon-btn next-btn" id="next-btn" type="button" aria-label="Next">›</button>
    </div>
  </div>

  <script>
    (() => {
      const btns   = Array.from(document.querySelectorAll('.thumb'));
      const imgs   = btns.map(b => b.querySelector('img')).filter(Boolean);
      const lb     = document.getElementById('lightbox');
      const lbImg  = document.getElementById('lightbox-image');
      const lbCont = document.getElementById('lightbox-content');
      let cur = 0;

      const render = () => { lbImg.src = imgs[cur].src; lbImg.alt = imgs[cur].alt; };
      const open   = i => { cur = i; render(); lb.classList.add('is-open'); lb.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; };
      const close  = () => { lb.classList.remove('is-open'); lb.setAttribute('aria-hidden','true'); lbImg.src=''; document.body.style.overflow=''; };
      const next   = () => { cur = (cur + 1) % imgs.length; render(); };
      const prev   = () => { cur = (cur - 1 + imgs.length) % imgs.length; render(); };

      btns.forEach((b, i) => b.addEventListener('click', () => open(i)));
      document.getElementById('close-btn').addEventListener('click', close);
      document.getElementById('next-btn').addEventListener('click', next);
      document.getElementById('prev-btn').addEventListener('click', prev);
      lb.addEventListener('click', e => { if (!lbCont.contains(e.target)) close(); });
      window.addEventListener('keydown', e => {
        if (!lb.classList.contains('is-open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowRight') next();
        if (e.key === 'ArrowLeft') prev();
      });
    })();
  </script>
</body>
</html>
